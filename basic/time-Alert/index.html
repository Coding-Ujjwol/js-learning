<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Page</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="https://kit.fontawesome.com/adf121722e.js" crossorigin="anonymous"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Single:wght@100..900&family=Indie+Flower&family=Macondo+Swash+Caps&family=Poiret+One&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="outer"></div>
    <div class="container">
      <div class="textShow">
        <div class="hour"><h1>1 :</h1></div>
        <div class="min"><h1>59 :</h1></div>
        <div class="sec"><h1>59</h1></div>
      </div>
      <div class="input">
        <h3>Enter Hour/Min/sec</h3>
        <input class="input-time" type="text" placeholder="Hrs">
        <input class="input-time" type="text" placeholder="min">
        <input class="input-time" type="text" placeholder="sec">
      </div>
      <div class="buttons-group">
        <button class="Start"><i class="fa-solid fa-play" style="color: #035420;"></i>Start</button>
        <button class="Stop"><i class="fa-solid fa-stop" style="color: #cd0707d4;"></i>Stop</button>
        <button class="Reset"><i class="fa-solid fa-clock-rotate-left" style="color: #dbc309;"></i>Reset</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
